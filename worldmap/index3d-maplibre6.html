    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.4.1/dist/maplibre-gl.mjs';

        window.maplibregl = maplibregl;

        import * as THREE from 'https://unpkg.com/three@0.185.0/build/three.module.min.js';
        window.THREE = THREE;
        //console.log("winTHREE:",THREE);

        /*  -- only after THREE is loaded, and "three" is available.
        import { LineMaterial } from 'https://unpkg.com/three@0.185.0/examples/jsm/lines/LineMaterial.js';
        window.LineMaterial = LineMaterial;

        import { Line2 } from 'https://unpkg.com/three@0.185.0/examples/jsm/lines/Line2.js';
        window.Line2 = Line2;

        import { LineSegments2 } from 'https://unpkg.com/three@0.185.0/examples/jsm/lines/LineSegments2.js';
        window.LineSegments2 = LineSegments2;
        */

        //Veness Geodesy: LonLat_nv and etc.
        //const { default:LatLon_nv, Ned, Cartesian } = await import('./node_modules/geodesy/latlon-nvector-ellipsoidal.js');
        //Set global {LatLon_nv: LatLon_nv, Ned: Ned, Cartesian: Cartesian };
        //export { LatLon_NvectorEllipsoidal as default, ...
        //   NvectorEllipsoidal as Nvector, Cartesian_Nvector as Cartesian, Ned, Dms}
        import {LatLon} from 'https://cdn.jsdelivr.net/npm/geodesy@2.4.0/utm.js';
        import Utm from 'https://cdn.jsdelivr.net/npm/geodesy@2.4.0/utm.js';
        
        import LatLon_nv, {
            Nvector,
            Cartesian,
            Ned,
            Dms
        } from 'https://cdn.jsdelivr.net/npm/geodesy@2.4.0/latlon-nvector-ellipsoidal.js';

        window.LatLon = LatLon;//has .toUtm()
        window.LatLon_nv = LatLon_nv;
        window.Nvector = Nvector;
        window.Cartesian = Cartesian;
        window.Ned = Ned;
        window.Dms = Dms;
        window.Utm = Utm;//has .toLatLon()

        // Tell classic scripts that the modules are ready
        window.dispatchEvent(new Event('libraries-ready'));
    </script>

    <style>

<div id='map'></div>

<script>
//Global vars
// You can also replace this with a custom style if you like.
//var mbstyle = 'mapbox://styles/mapbox/streets-v10';//OK
//var mbstyle = 'mapbox://styles/mapbox/light-v10';//all gray
//var mbstyle = 'mapbox://styles/mapbox/standard';//not good

window.addEventListener('libraries-ready', () => {
  console.log("Libraries are ready. You can now use MapLibre, THREE and Geodesy.");
  // You can now safely use THREE and Geodesy here or in other scripts.

  //Beg-mycode
  const titleDiv = document.getElementById('title');
  const descDiv = document.getElementById('desc');
  const valueDiv = document.getElementById('value');
  const valueMsg = document.getElementById('msg');
  const layerDiv = document.getElementById('layersel');
  const propertiesDiv = document.getElementById('properties');
  //var pupButton1;// = document.querySelector('#execButton1');
  //var pupButton2;// = document.querySelector('#execButton2');

//Obj data collections
const mapsStore = {};
const markersStore = {};
var markersOpacity = 1;

//PopUp code
const markerHeight = 50/2;
const markerRadius = 10;
const linearOffset = 25;
const popupOffsets = {
    'top': [0, 0],
    'top-left': [0, 0],
    'top-right': [0, 0],
    'bottom': [0, -markerHeight],
    'bottom-left': [linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
    'bottom-right': [-linearOffset, (markerHeight - markerRadius + linearOffset) * -1],
    'left': [markerRadius, (markerHeight - markerRadius) * -1],
    'right': [-markerRadius, (markerHeight - markerRadius) * -1]
};//Note: pointer is above target!

//Layers vis handling
const baseLay = "osm-tiles-layer";
window.handlePopupClick = function( o, n=0 ) {
  //if (window.map.getLayer(o) || window.map.isSourceLoaded(o)) {
  if (window.map.getLayer(o)) {
    const lays = window.map.getLayersOrder();
        switch (n) {
        case 0:
            window.map.moveLayer(o); //Bring on top
            break;
        case 1:
            window.map.removeLayer(o); //Do: onRemove() to cleanup
            break;
        case 2:
            window.map.moveLayer(o, baseLay);//Hide layer "o"
            break;
        case 3:
            let lstate = window.map.getLayer(o);//check-list layers; dim mkrs
            console.log("Layer obj:", lstate);
            //window.alert("Layers: "+ JSON.stringify(lays));
            //layerDiv.setHTML = "Layers: "+ JSON.stringify(lays);//not work
            dimToggleMkrs();
            break;
        case 4:
            window.map.moveLayer( baseLay );//Hide all
            break;
        case 5:
            //move all layer above baseLay (show-all)
            lays.forEach((lay,ix,ar) => {
                //console.log(lay , ix);
                if (lay !== baseLay) window.map.moveLayer( lay );
                });
            break;
        default:
                //do nothing
        }
  }
  else {
        console.log("No such layer: " + o);
        console.log( "Current layers:",  window.map.getLayersOrder() );
  }
};

var templt_mkrPup = function( p ) {
  //p: layerID
  let a = `window.handlePopupClick(${p}`;
  let html = `<div style="background-color:rgba(255,255,255,0.6)">
        <span>&nbsp;Layer ID:<b> ${p}</b></span><br/>&nbsp;
        <button type="button" onclick="${a},0)"><b>Move to top</b></button><br/>&nbsp;
        <button type="button" onclick="${a},1)"><b>Remove this</b></button><br/>&nbsp;
        <button type="button" onclick="${a},2)"><b>Hide this</b></button><hr/>
        &nbsp;<button type="button" onclick="${a},3)"><b>Markers on/off</b></button><br/>&nbsp;
        <button type="button" onclick="${a},4)"><b>Hide all</b></button><br/>&nbsp;
        <button type="button" onclick="${a},5)"><b>Show all</b></button><br/>&nbsp;
        </div>`;

  return html;
}

var lnglat0 = [100.53318, 13.736821];//scene map center (Chula)
var lnglat1 = [100.53078, 13.74620];//scene (pathumwan Xtion)
var lnglat2 = [100.53634, 13.73733];//scene (Sport club)
var sceneOrigin = lnglat0;

var oldLngLat = [100,13];
var threeInitFlag = false;

//3dbaseMap config
var basemap_showIndoor = false;
var basemap_show3dObjects = false;

//Others
var sharedRenderer;
var mainPopup; //on map-open, at map center

//Confine the map within this
const bounds = [
    [100.28865,13.47916], // Southwest coordinates
    [100.80009,13.91160] // Northeast coordinates
];

//THREE resources
var materialCache;
const grid_specs = { drawThis: true,
        grid_spec: [100, 10, 0x0000ff, 0x000000],
        grid_xyh: [50, 50, 0]
    }

//var map;//also works, but ignore it.
//MapLibre is initialized in do_3dmap.

const maplibregl = window.maplibregl;
//console.log("maplibregl:", maplibregl);

var do_3dmap = function() {
    //var people = {};
    //Set map style
    const mapStyleOsm = {
        "version": 8,
        "sources": {
            "osm-tiles": {
                "type": "raster",
                "tiles": [
                    "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],
                "tileSize": 256
            },
            //other sources
        },
        "layers": [
            {
                "id": "osm-tiles-layer",
                "type": "raster",
                "source": "osm-tiles",
                "minzoom": 0,
                "maxzoom": 19
            },
            //other layers
        ]
    };
    //Create the main map
    var map = new maplibregl.Map({
        container: 'map',
        //style: 'https://demotiles.maplibre.org/globe.json',
        style: mapStyleOsm,            
        projection: "mercator",
        maplibreLogo: true,
        center: lnglat0,
        zoom: 16,
        pitch: 40,
        bearing: 10,
        attributionControl: true,
        maxBounds: bounds,
        canvasContextAttributes: {antialias: true},
        centerClampedToGround: false,
        elevation: 0,
        maxPitch: 89.9
        /*
          config: {
              basemap: {showIndoor: basemap_showIndoor,
                          show3dObjects: basemap_show3dObjects}
          }
        */
    });

    map.addControl(new maplibregl.NavigationControl());//zoom, compass/reset
    //map.showLayers3DWireframe = false;
    
    map.addControl(new maplibregl.ScaleControl({maxWidth:80, unit:'metric'}));

    const options = {
        focusAfterOpen: false,
        offset: popupOffsets,
        className: "popupClass"
        }
    mainPopup =  new maplibregl.Popup(options)
                .setLngLat(lnglat0)
                .setHTML("<div 'background-color:rgba(255,255,255,0.5)'><b>Map center (Chula)</b></div>")
                .addTo(map);

    map.on('load', function() {
        window.map = map;
        var layers = map.getStyle().layers;
        var firstSymbolId;
        for (var i = 0; i < layers.length; i++) {
            if (layers[i].type === 'symbol') {
                firstSymbolId = layers[i].id;
                break;
            }
        }


        // *** Connect to the Node-RED Events Websocket
        var connect = function() {
            ws = new SockJS(location.pathname.split("index")[0] + 'socket');
            
            ws.onopen = function() {
                console.log("CONNECTED");
                ws.send(JSON.stringify({action:"connected", client:"index3d-maplibre.html"}));//send to server
            };
            
            ws.onclose = function() {
                console.log("DISCONNECTED");
                setTimeout(function() { connect(); }, 2500);
            };

            //This event works in conjunction with node-red msg injection
            ws.onmessage = function(e) {
                var data = JSON.parse(e.data);
                console.log("GOT",data);
                
                //Better use switch (data.type) here
                //Server side must provide "type", "task", jsondata
                
                if (Array.isArray(data)) {
                  //console.log("ARRAY");//ex. payload=[obji, objk,]; array of objects
                  for (var prop in data) {
                    //handle each item in the array (do-i-Command)
                    
                    if (data[prop].command) { doCommand( data[prop].command ); delete data[prop].command; }
                    //if (data[prop].command) { console.log("ARRAY data:", data[prop].command ); };//OK
                    
                    //if (data[prop].hasOwnProperty("name")) { set Marker(data[prop]); }
                    //else { console.log("SKIP A",data[prop]); }
                  }
                }
                
                else {
                  //my apps mostly use this; payload={command: {map: m}}; 
                  //console.log("NOT ARRAY");//But object
                  
                  if (data.command) { doCommand(data.command); delete data.command; }
                  //else {console.log("SKIP B", "markersStore:", markersStore);}
                }
            }
            
            //Sending messages to server
            /*
            //function sendMessage(text) {
            //    ws.send( text );
            // }
            */
        };//func

        //console.log("CONNECT TO",location.pathname + 'socket');
        connect();


        //Add interaction (click markers, etc)
        //MapLibre-GL, also has mousemove, etc.
        // e.point is the x, y coordinates of the mousemove event relative
        //   to the top-left corner of the map
        // e.lngLat is the longitude, latitude
        //compute delta x,y,z from oldLngLat (need Veness' geodesy) -- done
        map.on('click', (e) => {
                e.preventDefault();
                //clear ...
                layerDiv.innerHTML = "";
                
                let dist = new maplibregl.LngLat(...oldLngLat).distanceTo(e.lngLat).toFixed(3);
                let p1 = new LatLon_nv(oldLngLat[1], oldLngLat[0], 0);//seq: lat,long
                let p2 = new LatLon_nv(e.lngLat.lat, e.lngLat.lng, 0);
                let delta12 = p1.deltaTo(p2);
                let north = delta12.north.toFixed(3);
                let east = delta12.east.toFixed(3);
                let down = delta12.down.toFixed(3);
                //console.log("Delta:", delta12);
                //let mercatorMeter = 0;//MercatorCoordinate.fromLngLat({ lng: 0, lat: 0}, 0);
                let lng = e.lngLat.lng;
                let lat = e.lngLat.lat;
                oldLngLat = [lng, lat];
                //get Utm N/E
                
                let ll1 = new LatLon(lat, lng);
                let text = "new LatLon(15, 101): " + ll1;
                
                /*  
                try {
                    //This causes err, and disconnects websocket
                    //Also stops node-red
                    sendMessage( text )}
                catch(e) {} 
                ***/

                let utm1 = ll1.toUtm();
                console.log ("utm1=ll1.toUtm(): " + utm1);//need 3-4 decimal places
                //utm1:- zone, hemisphere, easting, northing, convergence, scale
                let nort1 = utm1.northing.toFixed(2);
                let east1 = utm1.easting.toFixed(2);
                valueMsg.innerHTML = `${lng.toFixed(5)},${lat.toFixed(5)}; <b>Dist:</b>${dist}; <b>Delta:</b> N=${north} E=${east} D=${down}<br/>UTM: ${nort1} ${east1}`;
                
        });
        //'obs-time': String( new Date().getTime() )

        //
        // DoCommand
        //

        var doCommand = function(c) {
            console.log("CMD",c);
            
            if (
              c.hasOwnProperty("map") &&
              c.map.hasOwnProperty("jsonData") &&
              c.map.hasOwnProperty("overlayID") &&
              !c.map.hasOwnProperty("task") )
                    {
                      addGeoPoly(c.map.overlayID, c.map.jsonData);
                      //simple extruded polygons by maplibre
                      //layer type: fill-extrusion
                    }

            // Inject/process something different than extruded polygon (using THREE, etc)
            if (
              c.hasOwnProperty("map") &&
              c.map.hasOwnProperty("jsonData") &&
              c.map.hasOwnProperty("overlayID") &&
              c.map.hasOwnProperty("task") )
            {
                      /* -----
                      Todo: feature-type --> task, done
                      For 'Point' feature, can do: marker, marker2, symbol, text, circle
                      For 'Polygon': outline, fill
                      */
                      
                      // Many possible objects
                      // Current use: texts for UTM grid
                      
                      console.log("--- feature specific handling");

              // layer type: symbol
              if (c.map.task === 'point') {
                addGeoPoint(c.map.overlayID, c.map.jsonData);
              }

              // data: LineString, MultiLineString
              if (c.map.task === 'linestring') {
                addGeoLine(c.map.overlayID, c.map.jsonData);
              }

              // Basic marker
              if (c.map.task === 'marker') {
                addGeoMarker(c.map.overlayID, c.map.jsonData);//overlayID is dummy
              }
              
              // Special marker accompanying a layer, has context menu attached
              ////if (c.map.task === 'marker2') {
              
              if (c.map.task === 'layerCtrlMkr') {
                addGeoMarker2(c.map.overlayID, c.map.jsonData);//overlayID is dummy
              }

              //Remove source, layer, layer-Ctrl-Marker according to spec
              //todo: similar actions: mapControl, Camera, Style 
              if (c.map.task === 'removeLayerCtrlMkr') {
                //console.log("*** removeLayerCtrlMkr body", c.map);
                removeLayerCtrlMkr(c.map.overlayID, c.map.jsonData);
              }
              
              if (c.map.task === 'remove1Layer') {
                remove1Layer(c.map.overlayID, c.map.jsonData);
              }
              if (c.map.task === 'removeLayers') {
                if (Array.isArray( c.map.overlayID )) {
                    removeLayers(c.map.overlayID, c.map.jsonData);
                }
              }

              //--- Three.js handling
              
              if (c.map.task === 'threeJSModel') {
                        //Ignore most input, and use test code
                        console.log("*** begin threeJSModel");
                        //addThreeJSModel(c.map.overlayID, c.map.jsonData, c.map.originLnglatH, c.map.XYZs, c.map.xy_gridH);
                        addThreeJSModel(c.map.overlayID, c.map.jsonData, c.map.originLnglatH, c.map.XYZs, c.map.grid_specs, c.map.polarGrid_specs);
                        console.log("*** done threeJSModel");
                }
              else if (c.map.task === 'threeJSModelMesh') {
                        console.log("*** threeJSModelMesh");
                        //addThreeJSModelMesh(c.map.overlayID, c.map.jsonData, c.map.originLnglatH, c.map.XYZs, c.map.xy_gridH);
                        addThreeJSModelMesh(c.map.overlayID, c.map.jsonData, c.map.originLnglatH, c.map.XYZs, c.map.grid_specs, c.map.polarGrid_specs);
                }
                

              
              else {
                console.log("*** Nothing to do with ThreeJS. Unknown task!", c.map);
                }

              //--- more feature specific handling

            }


            //Map view orientation specs
            /*
              {command: {map: m, 
                lat: 13.7475,
                lon: 100.6531,
                zoom: 17,
                pitch: 45,
              }}
            */
            var clat,clon;
            if (c.hasOwnProperty("lat")) { clat = c.lat; }
            if (c.hasOwnProperty("lon")) { clon = c.lon; }
            if (clat && clon) { map.setCenter([clon,clat]); }
            if (c.hasOwnProperty("zoom")) { map.setZoom(c.zoom); }
            if (c.hasOwnProperty("pitch")) { map.setPitch(c.pitch); }
            if (c.hasOwnProperty("bearing")) { map.setBearing(c.bearing); }
            if (c.hasOwnProperty("panTo")) { map.panTo(c.panTo, {duration: 700}); }
            if (c.hasOwnProperty("flyTo")) { map.flyTo(c.flyTo); }
        }//do_command

        console.log("After doCommand.");

        //This remove some resources
        
        var remove1Layer = function(o, c) {
            map.removeLayer(o);
        }
        
        var removeLayers = function(o, c) {
            //o: array of layerIDs
            //c: jsonData:
            o.forEach(item => {
                map.removeLayer(item);
            })
            const removeCtrlMkr = c.removeCtrlMkr || false;
            if (removeCtrlMkr === true) {
                o.forEach(item => {
                    markersStore[ item ].remove();//remove the marker
                    delete markersStore[ item ];
                })
            }
        }
        
        var removeLayerCtrlMkr = function(o, c) {
            //o: overlayID
            //c: jsonData:
                const remove = c.remove;
                const remsrc = remove.source || false;
                const remlay = remove.layer || false;
                const uniqName = c.mkrUniqueID;//marker is always removed
                
                //console.log("--- uniqName/mkrUniqID is:", uniqName);
                //console.log("--- remove is:", remove);

                if (remlay === true && map.getLayer(o)) {
                        map.removeLayer(o);
                        //console.log("===Done removeLayer");
                }
                if (remsrc === true && map.getSource(o)) {
                        map.removeSource(o);
                        //console.log("===Done removeSource");
                }
                
                if (uniqName !== 'noname') {
                        console.log("--- uniqName is:", uniqName, "markersStore:", markersStore);
                        if ( Object.hasOwn(markersStore, uniqName) ) {
                                //console.log("Attempt to remove the marker...");
                                markersStore[ uniqName ].remove();//remove the marker. sometimes fails!
                                delete markersStore[ uniqName ];
                        }
                        //console.log("Done remove marker/obj_link.");
                }
                else {
                        //nothing todo
                        console.log("...End of removeLayerCtrlMkr-process.");
                }
        }

        //This renders geojson data injected from node-red
        //also map.removeSource(sid), gs=map.getSource(sid), gs.setCoordinates(newxy)

        var addGeoLine = function(o,g) {
          //console.log('TODO: render a LineString.');
          //Must remove layer then source of the same name first;
          if (map.getLayer(o)) map.removeLayer(o);
          if (map.getSource(o)) map.removeSource(o);

          map.addSource(o, {
                'type': 'geojson',
                'data': g
          })

          let lineColor = g.properties.style['line-color'] || "#A35";
          //console.log("*** LineColor:", lineColor);
          let lineWidth = g.properties.style['line-width'] || 5;
          //console.log("*** LineWidth::", lineWidth);
          //Dont use this:'filter': ["==", "$type", "MultiLineString"], it fails.
          map.addLayer({
                'id': o,
                'type': 'line',
                'source': o,
                'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                },
                'paint': {
                        'line-color': lineColor,
                        'line-width': lineWidth
                },
                'filter': ["==", "$type", "LineString"],
          })
        }


        //Create layer's assoc marker(s)
        //May need?: fit-zoom to the mkrs
        //Related func: removeSrcAndLayer
        var addGeoMarker2 = function(o,g) {
                //o: (overlayID)
                //g: geojson for single point, with properties.uniqueName
                //   use 'featureCollection' with at least 1 item, currently use only the first
                //To get unique names for all items, timeStamp can be generated to use
                let mks = [];
                g.features.forEach(item => {
                  mks.push({
                    "options":{ "className": "marker",
                            "color": item.properties.color || 0xff0000,
                            "draggable": item.properties.draggable || false,
                            "rotation": item.properties.rotation || 0,
                            "altitude": item.properties.altitude || 0,
                            "popupText": item.properties.popup_text || "No popup_text!",
                            "scale": 0.75
                            },
                    "lnglat": item.geometry.coordinates,
                    "uniqName": item.properties.mkrUniqueID || "noName",
                    });
                  })

                  //For now assume only 1 item is in mks
                  const item = mks[0];
                  if ( markersStore[ item.uniqName ] === undefined && item.uniqName !== "noName") {

                          const mkr = new maplibregl.Marker( item.options )
                            .setLngLat( item.lnglat )

                        translateY: sceneOriginMercator.y,

                        scale: sceneOriginMercator.meterInMercatorCoordinateUnits()
                        };

                const m = new THREE.Matrix4().fromArray(args.defaultProjectionData.mainMatrix);
                const l = new THREE.Matrix4()
                        .makeTranslation(sceneTransform.translateX, sceneTransform.translateY, sceneTransform.translateZ)
                        .scale(new THREE.Vector3(sceneTransform.scale, -sceneTransform.scale, sceneTransform.scale));

                //In on.add(), there is: this.cameraTransform = ..., can use it (but I use the next line)
                this.camera.projectionMatrix = m.multiply(l);
                this.renderer.resetState();
                this.renderer.clearDepth();
                this.renderer.render(this.scene, this.camera);
                this.map.triggerRepaint();
          }

        }//class_ThreeObjCustomLayer

function make_pipe_betw_pnts(p1, p2, radius=5) {
  // Params:
  // p1:[x1,y1,z1]
  // p2:[x2,y2,z2]
  //const p1 = [p1[0], p1[1], p1[2]];
  //const p2 = [p2[0], p2[1], p2[2]];

  //next, just make a pipe using cylinder
  const startPosition = new THREE.Vector3(...p1);
  const endPosition = new THREE.Vector3(...p2);

  // Calculate the distance between the start and end positions
  const distance = startPosition.distanceTo(endPosition);

  // Define the radius and height of the pipe
  //const radius = 0.1;
  const height = distance;

  // Create cylinder/plane geometry
  //const long_geom = new THREE.CylinderGeometry(radius, radius, height, 8);
  const long_geom = new THREE.PlaneGeometry(radius, height);

  // Create the mesh with the geometry and material
  const geom_mat2 = new THREE.MeshPhongMaterial({
    color: 0xdd0099,
    side: THREE.DoubleSide,
    opacity: 0.8,
    transparent: true,
  });

  //Call it a PIPE
  const pipe = new THREE.Mesh(long_geom, geom_mat2);
  // Make obj shadow-casting
  //pipe.castShadow = true;
  //pipe.receiveShadow = false;

  // Position the pipe at the center between the start and end positions
  pipe.position.copy(
    startPosition.clone().add(endPosition).multiplyScalar(0.5)
  );

  // Set the rotation of the pipe
  const direction = new THREE.Vector3().subVectors(endPosition, startPosition);
  const quaternion = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  pipe.setRotationFromQuaternion(quaternion);
  pipe.castShadow = true;

  //Add to the scene in the caller
  //scene.add(pipe);
  return pipe;
}

function road_strip_betw_pnts(p1, p2, width=4) {
  // Params:
  // p1: [x1,y1,z1]
  // p2: [x2,y2,z2]
  // The strips ...
  // - longitudinal directions are nearly horizontal
  // - zero roll in all cases

  const startPosition = new THREE.Vector3(...p1);
  const endPosition = new THREE.Vector3(...p2);
  //const halfWidth = width/2;

  // Calculate the distance between the start and end positions
  //const length = startPosition.distanceTo(endPosition);

  // 1. Calculate length and directional forward vector
  const distance = startPosition.distanceTo(endPosition);
  const vForward = new THREE.Vector3().subVectors(endPosition, startPosition).normalize();

  // 2. Define standard World Up axis (Assuming Z-Up for GIS/MapLibre integration)
  const worldUp = new THREE.Vector3(0, 0, 1);

  // 3. Calculate Right Vector (perpendicular to Forward and World Up)
  // This guarantees the width axis remains perfectly horizontal (Zero Roll)
  const vRight = new THREE.Vector3().crossVectors(vForward, worldUp).normalize();

  // 4. Calculate the local Up Vector for the road surface plane
  const vUp = new THREE.Vector3().crossVectors(vRight, vForward).normalize();

  // 5. Create a flat road surface geometry
  // PlaneGeometry width maps to X-axis, height (length) maps to Y-axis
  const strip_geom = new THREE.PlaneGeometry(width, distance);

  const strip = new THREE.Mesh(strip_geom, materialCache.glassR);
  strip.castShadow = true;
  strip.receiveShadow = true;

  // 6. Set center-line position between start and end positions
  strip.position.copy(startPosition.clone().add(endPosition).multiplyScalar(0.5));

  // 7. Manually build the rotation matrix using our calculated directions
  // This explicitly maps local coordinates to world directions with zero roll
  const rotationMatrix = new THREE.Matrix4().makeBasis(vRight, vForward, vUp);
  strip.quaternion.setFromRotationMatrix(rotationMatrix);

  //Cast shadow?
  //strip.castShadow = true;//No effect!

  //Add the strip to the scene in the caller ... scene.add(strip);
  return strip;
}
